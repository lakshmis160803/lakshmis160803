name: Update README Stats Card

on:
  schedule:
    - cron: "0 0 * * *"  # runs once daily at midnight UTC
  workflow_dispatch:      # lets you trigger it manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=lakshmis160803&show_icons=true&hide_border=true&bg_color=0D1117&title_color=FFA500&icon_color=FFA500&text_color=C9D1D9
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=lakshmis160803&layout=compact&hide_border=true&bg_color=0D1117&title_color=FFA500&text_color=C9D1D9
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --staged --quiet || git commit -m "Update stats cards"
          git push
